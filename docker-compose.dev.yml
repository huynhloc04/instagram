
services:
  app:
    container_name: app_dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
      - 5678:5678
    environment:
      - FLASK_APP=app.main
      - FLASK_DEBUG=1
    volumes:
      - .:/instagram
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # Exclude virtual environment and cache files
      - /instagram/.venv
    entrypoint: [
      "python", "-m", "debugpy",
      "--listen", "0.0.0.0:5678",
      # "--wait-for-client",
      "-m", "flask", "run",
      "--host=0.0.0.0",
      "--port=8000"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  mysql:
    image: mysql:latest
    container_name: mysql_db
    ports:
      - 3306:3306
    env_file: 
      - .env
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery
    command: celery -A app.celery_worker.celery worker --loglevel=info -c 4
    env_file: 
      - .env
    volumes:
      - .:/instagram
      # Exclude virtual environment and cache files
      - /instagram/.venv
    depends_on:
      - redis

  celery_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower
    command: celery -A app.celery_worker.celery flower --port=5555
    ports:
      - 5557:5555
    env_file: 
      - .env
    volumes:
      - .:/instagram
      # Exclude virtual environment and cache files  
      - /instagram/.venv
    depends_on:
      - celery_worker

volumes:
  mysql_data:
  redis_data: